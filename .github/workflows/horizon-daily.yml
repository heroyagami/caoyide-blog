name: Daily AI × Law Intelligence (Horizon)

on:
  schedule:
    - cron: '30 0 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  horizon-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned Horizon
        run: |
          git clone https://github.com/heroyagami/Horizon.git Horizon-ai-news
          cd Horizon-ai-news
          git checkout 7c193de8910802ef73a2588c0b851f0772fbc1b2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Horizon
        run: |
          cd Horizon-ai-news
          uv sync --frozen

      - name: Use repository config
        run: cp config.json Horizon-ai-news/data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd Horizon-ai-news
          uv run horizon --hours 48

      - name: Convert only law/compliance output to review drafts
        run: |
          python scripts/prepare-horizon-post.py \
            Horizon-ai-news/docs/_posts \
            content/posts/ai-daily

      - name: Commit review drafts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Horizon AI"
          git add content/posts/ai-daily/
          git diff --staged --quiet || git commit -m "chore: add AI-law review draft $(date +'%Y-%m-%d')"
          git push
