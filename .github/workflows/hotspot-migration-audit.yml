name: Hotspot migration audit
on:
  pull_request:
    paths:
      - 'docs/hotspot-production.md'
      - 'scripts/audit-hotspot-migration.py'
      - '.github/workflows/sync-dailynews.yml'
      - 'scripts/sync-dailynews.py'
      - 'data/hotspot-source.json'
      - 'data/dailynews-archive-manifest.json'
      - 'docs/dailynews-legacy/**'
      - '.github/workflows/hotspot-migration-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned legacy baseline offline
        run: python3 scripts/audit-hotspot-migration.py --source-ref ad28a13ce48e118f430d17a152be0d47acd2db5b
      - name: Verify legacy sync retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/sync-dailynews.yml
          test ! -e scripts/sync-dailynews.py
          python3 -c 'import json; assert json.load(open("data/hotspot-source.json"))["mode"]=="site"'
