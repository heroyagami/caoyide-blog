name: One-time production domain diagnostic
on:
  push:
    paths:
      - '.github/workflows/diagnose-caoyide.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Public DNS, hosting headers and current article
        shell: bash
        run: |
          set +e
          echo '### Domain DNS'
          for domain in caoyide.com www.caoyide.com; do
            echo "DNS $domain"
            for record in A AAAA CNAME NS; do
              echo "$record:"
              dig +short "$domain" "$record" || true
            done
          done
          echo '### HTTP headers'
          for url in https://caoyide.com/ https://www.caoyide.com/ https://caoyide-blog.pages.dev/ https://heroyagami.github.io/; do
            echo "URL $url"
            curl -kLsSI --max-time 20 "$url" | grep -iE '^(HTTP/|server:|cf-|x-|location:|cache-control:|etag:|last-modified:|age:)' | head -35 || true
          done
          echo '### Published article HTTP status and title'
          for url in https://caoyide.com/daily/2026/10/2026-10-11/ https://www.caoyide.com/daily/2026/10/2026-10-11/ https://caoyide-blog.pages.dev/daily/2026/10/2026-10-11/; do
            echo "ARTICLE $url"
            curl -kLsS --max-time 20 -o /tmp/article_check.html -w 'status=%{http_code} final=%{url_effective} bytes=%{size_download}\n' "$url" || true
            grep -om1 '<title>[^<]*</title>' /tmp/article_check.html || true
          done
          echo '### Homepage newest content marker'
          curl -kLsS --max-time 20 -o /tmp/caoyide_home.html https://caoyide.com/ || true
          grep -oE '2026.(10.11|09.24)' /tmp/caoyide_home.html | sort | uniq -c || true
