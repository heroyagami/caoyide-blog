name: Validate site build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate legal review gate
        run: python3 scripts/check-legal-review.py

      - name: Build Hugo and law library
        run: bash build.sh
