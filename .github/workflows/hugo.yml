name: Deploy Hugo site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo and VuePress build data
        uses: actions/cache@v4
        with:
          path: |
            .hugo
            law-site/node_modules
            law-site/docs/.vuepress/.cache
          key: site-build-${{ runner.os }}-${{ hashFiles('law-site/package.json', 'hugo.toml') }}
          restore-keys: |
            site-build-${{ runner.os }}-

      - name: Validate automated legal content review status
        run: python3 scripts/check-legal-review.py

      - name: Validate content integrity
        run: python3 scripts/check-site-integrity.py

      - name: Build
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
