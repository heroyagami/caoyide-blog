name: Validate Hugo build and Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo and VuePress build data
        uses: actions/cache@v4
        with:
          path: |
            .hugo
            law-site/node_modules
            law-site/docs/.vuepress/.cache
          key: site-build-${{ runner.os }}-${{ hashFiles('law-site/package.json', 'law-site/package-lock.json', 'hugo.toml') }}
          restore-keys: |
            site-build-${{ runner.os }}-

      - name: Validate automated legal content review status
        run: python3 scripts/check-legal-review.py

      - name: Validate content integrity
        run: python3 scripts/check-site-integrity.py

      - name: Build
        run: bash build.sh

      - name: Validate built internal links
        run: python3 scripts/check-built-links.py

      # Production is deployed by Cloudflare Pages Git integration on main.
      # Verify actual Hugo-generated permalinks instead of guessing from filenames.
      - name: Verify Cloudflare production deployment
        shell: bash
        run: |
          set -euo pipefail
          article="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('public/index.xml').getroot()
          links = [item.findtext('link', '') for item in root.findall('./channel/item')]
          print(next(link for link in links if '/daily/' in link))
          PY
          )"
          for attempt in $(seq 1 16); do
            echo "Production check $attempt: $article"
            status="$(curl --silent --show-error --location --output /tmp/deployed-article.html --write-out '%{http_code}' --max-time 20 "$article" || true)"
            if [ "$status" = '200' ] && grep -q '曹义德律师' /tmp/deployed-article.html; then
              homepage_status="$(curl --silent --show-error --location --output /tmp/deployed-home.html --write-out '%{http_code}' --max-time 20 'https://caoyide.com/' || true)"
              article_path="${article#https://caoyide.com}"
              if [ "$homepage_status" = '200' ] && grep -Fq "$article_path" /tmp/deployed-home.html; then
                echo "Verified latest daily on production homepage: $article"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Cloudflare Git deployment has not surfaced the latest daily on production. Check the Cloudflare Pages deployment for this main commit."
          exit 1
