name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo and VuePress build data
        uses: actions/cache@v4
        with:
          path: |
            .hugo
            law-site/node_modules
            law-site/docs/.vuepress/.cache
          key: site-build-${{ runner.os }}-${{ hashFiles('law-site/package.json', 'law-site/package-lock.json', 'hugo.toml') }}
          restore-keys: |
            site-build-${{ runner.os }}-

      - name: Validate automated legal content review status
        run: python3 scripts/check-legal-review.py

      - name: Validate content integrity
        run: python3 scripts/check-site-integrity.py

      - name: Build
        run: bash build.sh

      - name: Validate built internal links
        run: python3 scripts/check-built-links.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Check Cloudflare Pages deploy credentials
        id: cloudflare_auth
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare credentials are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::error::Cloudflare Pages deployment unavailable: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets/variables.'
            exit 1
          fi

      - name: Deploy Hugo output to Cloudflare Pages
        if: steps.cloudflare_auth.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=caoyide-blog --branch=main

      - name: Verify production article after Cloudflare deploy
        if: steps.cloudflare_auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest="$(find content/daily -type f -name '*.md' | sort | tail -1)"
          relative="${latest#content/daily/}"
          yyyy="$(echo "$relative" | cut -d/ -f1)"
          mm="$(echo "$relative" | cut -d/ -f2)"
          slug="$(basename "$relative" .md)"
          article="https://caoyide.com/daily/$yyyy/$mm/$slug/"
          for attempt in 1 2 3 4 5; do
            echo "Production check $attempt: $article"
            status="$(curl --silent --show-error --location --output /tmp/deployed-article.html --write-out '%{http_code}' --max-time 30 "$article" || true)"
            if [ "$status" = '200' ] && grep -q '曹义德律师' /tmp/deployed-article.html; then
              echo "Published successfully: $article"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Cloudflare deployment did not surface latest daily: $article"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
