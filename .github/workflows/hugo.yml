name: Validate Hugo build and Cloudflare Git deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo and VuePress build data
        uses: actions/cache@v4
        with:
          path: |
            .hugo
            law-site/node_modules
            law-site/docs/.vuepress/.cache
          key: site-build-${{ runner.os }}-${{ hashFiles('law-site/package.json', 'law-site/package-lock.json', 'hugo.toml') }}
          restore-keys: |
            site-build-${{ runner.os }}-

      - name: Validate automated legal content review status
        run: python3 scripts/check-legal-review.py

      - name: Validate content integrity
        run: python3 scripts/check-site-integrity.py

      - name: Build
        run: bash build.sh

      - name: Verify DailyNews hotspot pages in Hugo output
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          must_exist() { if [ ! -f "$1" ]; then echo "::error::Missing built file: $1"; failed=1; fi; }
          must_contain() { if ! grep -Fq "$2" "$1"; then echo "::error::Missing '$2' in $1"; failed=1; fi; }
          must_not_contain() { if grep -Fq "$2" "$1"; then echo "::error::Unexpected '$2' in $1"; failed=1; fi; }
          must_exist public/hotspot-daily/index.html
          must_exist public/hotspot-daily/2026/10/2026-10-11/index.html
          must_exist public/index.html
          must_exist public/cases/index.html
          if [ "$failed" -eq 0 ]; then
            must_contain public/hotspot-daily/2026/10/2026-10-11/index.html '今日热点深度文章池'
            must_contain public/index.html '/hotspot-daily/'
            must_contain public/hotspot-daily/index.html '热点深度'
            must_not_contain public/hotspot-daily/index.html '代理某某证券诉某房地产集团'
            must_contain public/cases/index.html '代理某某证券诉某房地产集团'
            must_not_contain public/cases/index.html '黄奇帆被查'
          fi
          exit "$failed"

      - name: Validate built internal links
        run: python3 scripts/check-built-links.py

      - name: Verify Cloudflare deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest")"
            state="$(jq -r --arg sha "$GITHUB_SHA" '
              [.check_runs[] | select(.head_sha == $sha and .name == "Cloudflare Pages" and .app.slug == "cloudflare-workers-and-pages")]
              | sort_by(.id) | last
              | if . == null then "waiting" elif .status != "completed" then "waiting" else .conclusion end
            ' <<< "$checks")"
            echo "Cloudflare check for $GITHUB_SHA: $state (attempt $attempt)"
            if [ "$state" = 'success' ]; then
              exit 0
            fi
            if [ "$state" != 'waiting' ]; then
              echo "::error::Cloudflare deployment for $GITHUB_SHA completed with $state"
              exit 1
            fi
            sleep 15
          done
          echo "::error::No successful Cloudflare deployment for $GITHUB_SHA within 10 minutes"
          exit 1

      # Production is deployed by Cloudflare Pages Git integration on main.
      # Verify actual Hugo-generated permalinks instead of guessing from filenames.
      - name: Verify Cloudflare production deployment
        shell: bash
        run: |
          set -euo pipefail
          article="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('public/index.xml').getroot()
          links = [item.findtext('link', '') for item in root.findall('./channel/item')]
          print(next(link for link in links if '/daily/' in link))
          PY
          )"
          for attempt in $(seq 1 16); do
            echo "Production check $attempt: $article"
            status="$(curl --silent --show-error --location --output /tmp/deployed-article.html --write-out '%{http_code}' --max-time 20 "$article" || true)"
            if [ "$status" = '200' ] && grep -q '曹义德律师' /tmp/deployed-article.html; then
              homepage_status="$(curl --silent --show-error --location --output /tmp/deployed-home.html --write-out '%{http_code}' --max-time 20 'https://caoyide.com/' || true)"
              article_path="${article#https://caoyide.com}"
              if [ "$homepage_status" = '200' ] && grep -Fq "$article_path" /tmp/deployed-home.html; then
                echo "Verified latest daily on production homepage: $article"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Cloudflare Git deployment has not surfaced the latest daily on production. Check the Cloudflare Pages deployment for this main commit."
          exit 1

      - name: Verify newest hotspot issue on caoyide.com
        shell: bash
        run: |
          set -euo pipefail
          newest="$(find content/hotspot-daily -type f -name '20??-??-??.md' | sort | tail -1)"
          date="$(basename "$newest" .md)"
          year="$(basename "$(dirname "$(dirname "$newest")")")"
          month="$(basename "$(dirname "$newest")")"
          route="/hotspot-daily/${year}/${month}/${date}/"
          for attempt in $(seq 1 20); do
            article_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-hotspot.html --write-out '%{http_code}' "https://caoyide.com${route}" || true)"
            home_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-hotspot-home.html --write-out '%{http_code}' 'https://caoyide.com/' || true)"
            archive_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-hotspot-archive.html --write-out '%{http_code}' 'https://caoyide.com/hotspot-daily/' || true)"
            cases_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-cases.html --write-out '%{http_code}' 'https://caoyide.com/cases/' || true)"
            if [ "$article_status" = '200' ] && [ "$home_status" = '200' ] \
              && [ "$archive_status" = '200' ] && [ "$cases_status" = '200' ] \
              && grep -q '今日热点深度文章池' /tmp/live-hotspot.html \
              && grep -Fq "$route" /tmp/live-hotspot-home.html \
              && grep -q '热点深度文章列表' /tmp/live-hotspot-archive.html \
              && grep -Fq "$route" /tmp/live-hotspot-archive.html \
              && ! grep -q '代理某某证券诉某房地产集团' /tmp/live-hotspot-archive.html \
              && grep -q '代理某某证券诉某房地产集团' /tmp/live-cases.html; then
              echo "Verified newest hotspot issue in production: https://caoyide.com${route}"
              exit 0
            fi
            echo "Hotspot production check ${attempt}: article=${article_status} home=${home_status}"
            sleep 15
          done
          echo "::error::Newest hotspot issue is not visible on caoyide.com"
          exit 1

      - name: Verify published evergreen article on caoyide.com
        shell: bash
        run: |
          set -euo pipefail
          route='/posts/debt-no-agreed-interest/'
          test -f "public/${route#/}index.html"
          grep -Fq "$route" public/sitemap.xml
          for attempt in $(seq 1 20); do
            article_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-evergreen.html --write-out '%{http_code}' "https://caoyide.com${route}" || true)"
            sitemap_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/live-evergreen-sitemap.xml --write-out '%{http_code}' 'https://caoyide.com/sitemap.xml' || true)"
            if [ "$article_status" = '200' ] && [ "$sitemap_status" = '200' ] \
              && grep -Fq '欠款没有约定利息，还能要求对方支付利息吗' /tmp/live-evergreen.html \
              && grep -Fq '借款期限内没有约定利息' /tmp/live-evergreen.html \
              && grep -Fq "https://caoyide.com${route}" /tmp/live-evergreen-sitemap.xml; then
              echo "Verified evergreen article: https://caoyide.com${route}"
              exit 0
            fi
            echo "Evergreen production check ${attempt}: article=${article_status}, sitemap=${sitemap_status}"
            sleep 15
          done
          echo "::error::Evergreen article missing from production, body, or sitemap: https://caoyide.com${route}"
          exit 1

      - name: Verify newest reviewed evergreen on caoyide.com
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import pathlib
          import re
          import time
          import tomllib
          import urllib.request
          import xml.etree.ElementTree as ET

          posts = []
          for path in pathlib.Path("content/posts").rglob("*.md"):
              raw = path.read_text(encoding="utf-8")
              if not raw.startswith("+++\n"):
                  continue
              parts = raw.split("+++", 2)
              if len(parts) != 3:
                  continue
              try:
                  fm = tomllib.loads(parts[1])
              except tomllib.TOMLDecodeError:
                  continue
              if fm.get("type") != "evergreen" or fm.get("draft", True):
                  continue
              if fm.get("review_status") != "verified":
                  continue
              posts.append((str(fm.get("date", "")), path.name, fm, parts[2]))
          assert posts, "No verified evergreen article found"
          _, _, fm, body = max(posts, key=lambda p: (p[0], p[1]))
          slug = fm["slug"]
          route = "/posts/" + slug + "/"
          url = "https://caoyide.com" + route
          built = pathlib.Path("public") / route.lstrip("/") / "index.html"
          assert built.is_file(), f"Hugo output missing: {built}"
          sitemap_built = pathlib.Path("public/sitemap.xml").read_text(encoding="utf-8")
          assert url in sitemap_built, f"Hugo sitemap missing {url}"
          title = fm["title"]
          core = next((line.strip() for line in body.splitlines() if line.strip() and not line.lstrip().startswith("#")), "")
          core = re.sub(r"[\*\x60_]+", "", core)[:24]
          assert len(core) >= 10, "No substantive first paragraph to verify"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Caoyide-Evergreen-Publication-Check/1.0", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  assert response.status == 200, f"HTTP {response.status}: {url}"
                  return response.read().decode("utf-8", errors="replace")

          for attempt in range(1, 21):
              try:
                  live = fetch(url)
                  text = html.unescape(re.sub(r"<[^>]+>", "", live))
                  text = re.sub(r"\s+", "", text)
                  assert title in text, f"Title missing: {title}"
                  assert re.sub(r"\s+", "", core) in text, f"Article core missing: {core}"
                  live_sitemap = fetch("https://caoyide.com/sitemap.xml")
                  assert url in live_sitemap, f"Live sitemap missing {url}"
                  print(f"EVERGREEN PRODUCTION VERIFIED: {url}; title={title}; core={core}; sitemap=yes")
                  break
              except Exception as exc:
                  print(f"Evergreen production attempt {attempt}/20: {exc}", flush=True)
                  if attempt == 20:
                      raise
                  time.sleep(15)
          PY
