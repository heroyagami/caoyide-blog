{{- with .Params.topics -}}
<section class="article-topic-links" aria-label="相关专业专题">
  <div class="article-topic-title">相关专业专题</div>
  <div class="article-topic-list">
    {{- range . }}
      <a href="{{ printf "/topics/%s/" (. | urlize) }}">{{ . }}</a>
    {{- end }}
  </div>
</section>
<style>
.article-topic-links{margin:1.2rem 0;padding:1rem 1.1rem;border:1px solid var(--card-separator-color);border-radius:14px;background:var(--card-background)}.article-topic-title{font-weight:700;margin-bottom:.65rem}.article-topic-list{display:flex;flex-wrap:wrap;gap:.55rem}.article-topic-list a{display:inline-flex;padding:.45rem .7rem;border-radius:999px;border:1px solid var(--card-separator-color);text-decoration:none;font-size:.88rem}.article-topic-list a:hover{border-color:var(--accent-color);color:var(--accent-color)}
</style>
{{- end -}}
