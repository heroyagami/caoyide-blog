# Cloudflare Pages project deployment configuration.
# Hugo + VuePress assets are built with `bash build.sh` in GitHub Actions.
# If using Cloudflare Git integration, set its Build command to `bash build.sh`
# and its Build output directory to `public` in the Cloudflare dashboard.
# The Wrangler configuration does not support a top-level `command` key.
name = "caoyide-blog"
pages_build_output_dir = "./public"
